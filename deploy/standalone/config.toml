# ========================================
#  监护仪监控系统 - 配置文件
# ========================================

# 监听地址
listen_addr = "0.0.0.0"

# 设备 TCP 连接端口
tcp_port = 9000

# WebSocket 端口（前端连接）
ws_port = 8080

# HTTP 静态文件端口
http_port = 3000

# 最大连接数
max_connections = 64

# 数据目录
data_dir = "./data"

# 日志目录
log_dir = "./logs"

# Web 前端文件目录
web_dir = "./web"

# 日志级别: trace, debug, info, warn, error
log_level = "debug"

# ========================================
#  数据保留设置
# ========================================
# 体征数据保留小时数
vital_retention_hours = 24

# 波形数据保留分钟数
wave_retention_minutes = 2

# 报警信息保留分钟数
alarm_retention_minutes = 2

# 心跳间隔（秒）
heartbeat_interval_secs = 30

# ========================================
#  IP 到床位号映射（手动配置）
# ========================================
[ip_to_bed]
"10.10.12.65" = 1
"10.10.12.66" = 2
"10.10.12.67" = 3
"10.10.12.60" = 4
"10.10.12.61" = 5
"10.10.12.62" = 6
"10.10.12.63" = 7
"10.10.12.64" = 8

