<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>服务器设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #0f0f1a;
    color: #ddd;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
  }
  h1 { font-size: 18px; color: #fff; margin-bottom: 6px; letter-spacing: 1px; }
  p.sub { font-size: 12px; color: #777; margin-bottom: 20px; line-height: 1.6; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 14px;
    background: #1a1a26;
    border: 1px solid #333;
    border-radius: 4px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #4a8aca; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aaa; margin: 4px 0 18px; cursor: pointer; }
  .check input { width: 15px; height: 15px; cursor: pointer; }
  button {
    width: 100%;
    padding: 10px;
    background: #2a4a6a;
    border: 1px solid #4a8aca;
    border-radius: 4px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #35597d; }
  button:disabled { opacity: 0.5; cursor: default; }
  #err { margin-top: 10px; font-size: 13px; color: #ff5555; min-height: 18px; }
</style>
</head>
<body>
  <h1>服务器设置</h1>
  <p class="sub">
    填写监护服务所在机器的地址。局域网内任意一台运行了监护服务的机器均可作为服务器，多台终端指向同一地址即可共享数据。
  </p>

  <label for="host">服务器 IP / 主机名</label>
  <input id="host" type="text" placeholder="例如 192.168.1.100 或 127.0.0.1" />

  <div class="row">
    <div>
      <label for="port">Web 端口</label>
      <input id="port" type="number" min="1" max="65535" value="3000" />
    </div>
    <div>
      <label>数据端口</label>
      <input type="text" value="8080（自动）" disabled />
    </div>
  </div>

  <label class="check">
    <input id="fullscreen" type="checkbox" />
    <span>启动后全屏显示（监护工位建议开启）</span>
  </label>

  <button id="save">保存并连接</button>
  <div id="err"></div>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const hostEl = document.getElementById('host');
    const portEl = document.getElementById('port');
    const fsEl = document.getElementById('fullscreen');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('save');

    async function init() {
      try {
        const cfg = await invoke('get_config');
        if (cfg) {
          hostEl.value = cfg.host || '';
          portEl.value = cfg.http_port || 3000;
          fsEl.checked = !!cfg.fullscreen;
        }
      } catch (e) {
        errEl.textContent = '读取配置失败: ' + e;
      }
    }

    btn.addEventListener('click', async () => {
      const host = hostEl.value.trim();
      const httpPort = parseInt(portEl.value, 10);
      if (!host) {
        errEl.textContent = '请输入服务器地址';
        return;
      }
      if (!httpPort || httpPort < 1 || httpPort > 65535) {
        errEl.textContent = '端口无效（1-65535）';
        return;
      }
      errEl.textContent = '';
      btn.disabled = true;
      try {
        await invoke('connect_server', {
          config: { host, http_port: httpPort, fullscreen: fsEl.checked },
        });
      } catch (e) {
        errEl.textContent = '连接失败: ' + e;
        btn.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
