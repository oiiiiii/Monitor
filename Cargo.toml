[workspace]
resolver = "2"
members = [
    "monitor-common",
    "monitor-proto",
    "monitor-access",
    "monitor-consumer",
    "monitor-push",
    "monitor-test",
    "monitor-standalone",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Monitor Team"]

[workspace.dependencies]
# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 配置管理
config = "0.14"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 网络
bytes = "1"

# RabbitMQ
lapin = { version = "2", features = ["rustls"] }
futures = "0.3"

# 数据库
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# TDengine 的 REST API 客户端用 reqwest
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# 连接池
deadpool-postgres = "0.14"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "aio"] }

# WebSocket
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"
httparse = "1"

# 测试
pretty_assertions = "1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
